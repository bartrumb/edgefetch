  # 6a. Arbeitnow direct JSON API (/api/job-board-api...)
  - match:
      hosts:
        - www.arbeitnow.com
        - arbeitnow.com
      pathPrefix: /api/job-board-api
    twin:
      id: arbeitnow-feed
      fetchUrl: "{requestUrl}"
      kind: json
      accept: application/json
    extract:
      vars:
        jobCount:
          paths: [data]
          format: array_len
      requireVars:
        - jobCount
      titleTemplate: "Arbeitnow Job Feed ({jobCount})"
      sections:
        - heading: ""
          arrayPath: data
          limit: 50
          emptyText: "No open positions currently listed."
          itemVars:
            jTitle:
              paths: [title]
              trim: true
              default: Role
            jUrl:
              paths: [url]
              requireHttps: true
            company:
              paths: [company_name]
              trim: true
              default: "-"
            loc:
              paths: [location]
              trim: true
              default: "-"
            wp:
              paths: [remote]
              format: bool_map
              trueValue: Remote
              falseValue: On-site
            roleCell:
              template: "[{jTitle}]({jUrl})"
              whenVars: [jUrl]
              fallbackVar: jTitle
          collectLinkVars:
            - jUrl
          columns:
            - header: Role
              template: "{roleCell}"
            - header: Company
              template: "{company}"
            - header: Location
              template: "{loc}"
            - header: Workplace
              template: "{wp}"

  # 6b. Arbeitnow HTML board upgrade (/jobs -> /api/job-board-api)
