# Shared Go + TypeScript Declarative Site Adapter: Go Packages (pkg.go.dev)
id: pkg-go-dev
name: "Go Packages (pkg.go.dev)"
category: developer
description: "Extracts Go module README and API documentation sections cleanly from pkg.go.dev."
domains:
  - pkg.go.dev
exampleUrls:
  - "https://pkg.go.dev/github.com/coder/websocket"

# Post-fetch Go module README & API Documentation extraction
htmlRoutes:
  - match:
      minSegments: 1
    mode: dom
    vars:
      title:
        cssText:
          - title
        stripSuffix: "- Go Packages"
      readme:
        cssHtmlToMd:
          - "div.UnitReadme-content"
      docs:
        cssHtmlToMd:
          - "div.Documentation-content"
        replaceAll:
          from: "\u00b6"
          to: ""
    requireBulletsOrVars:
      - readme
      - docs
    titleTemplate: "{title}"
    sections:
      - heading: "Overview / README"
        textVar: readme
      - heading: Documentation
        textVar: docs
