            jUrl:
              paths: [url]
              requireHttps: true
            company:
              paths: [companyName]
              trim: true
              default: "-"
            geo:
              paths: [jobGeo]
              trim: true
              default: Remote
            cur:
              paths: [salaryCurrency]
              trim: true
              default: USD
            salMin:
              paths: [annualSalaryMin]
              excludeEquals: "0"
            salMax:
              paths: [annualSalaryMax]
              excludeEquals: "0"
            salRange:
              template: "{cur} {salMin}–{salMax}"
