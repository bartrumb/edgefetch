version: 2
project_name: edgefetch

before:
  hooks:
    - go mod verify

builds:
  - id: edgefetch
    main: ./cmd/edgefetch
    binary: edgefetch
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/bartrumb/edgefetch/v2/internal/agent.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
      - mipsle
    goarm:
      - "7"
    gomips:
      - softfloat
    ignore:
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: mipsle
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: mipsle
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: mipsle

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
