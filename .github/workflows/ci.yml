name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go Vet, Staticcheck, Govulncheck, Race Detector & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
          cache: true

      - name: Verify minimal dependency graph (only coder/websocket, zero transitive deps)
        run: |
          go mod verify
          extra=$(go mod graph | awk '$2 !~ /^github\.com\/coder\/websocket@v/ && $2 !~ /^go@/ && $2 !~ /^toolchain@/ { print $0 }')
          if [ -n "$extra" ]; then
            echo "ERROR: unexpected Go dependencies in module graph:"
            echo "$extra"
            exit 1
          fi

      - name: Check gofmt formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck & govulncheck (pinned Go 1.27-compatible versions)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$(go env GOPATH)/bin/staticcheck" ./...
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Run tests with ThreadSanitizer race detector (-race) & coverage
        run: go test -v -race -count=1 -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -n 15

      - name: Run native Go fuzzing smoke suite
        run: |
          go test -fuzz=FuzzRobotsParseAndMatch -fuzztime=2s ./internal/politeness
          go test -fuzz=FuzzParseRetryAfter -fuzztime=2s ./internal/politeness
          go test -fuzz=FuzzIsPublicIP -fuzztime=2s ./internal/politeness
          go test -fuzz=FuzzClassify -fuzztime=2s ./internal/classify
          go test -fuzz=FuzzExtractHTML -fuzztime=2s ./internal/extract
          go test -fuzz=FuzzParseLlmsTxt -fuzztime=2s ./internal/extract
          go test -fuzz=FuzzExtractPDFPureGo -fuzztime=2s ./internal/extract
          go test -fuzz=FuzzDeclarativeFormat -fuzztime=2s ./internal/extract
          go test -fuzz=FuzzBotAuthVerifyRequest -fuzztime=2s ./internal/botauth
          go test -fuzz=FuzzValidateCustomHeaders -fuzztime=2s ./internal/crawl
          go test -fuzz=FuzzPublicHTTPS -fuzztime=2s ./internal/crawl

      - name: Run allocation microbenchmarks & WASI WebAssembly build check
        run: |
          go test -bench=. -benchmem ./...
          GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/edgefetch-wasm.wasm ./cmd/edgefetch-wasm
          rm -f /tmp/edgefetch-wasm.wasm

  hub:
    name: Cloudflare Hub Type-Check & Bundle Dry-Run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: hub/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify cross-component version lockstep
        working-directory: .
        run: |
          cfg_ver=$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' edgefetch_fat/config.yaml)
          agent_ver=$(sed -n 's/^var[[:space:]]\+Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' internal/agent/agent.go)
          hub_ver=$(node -p "require('./hub/package.json').version")
          test -n "$cfg_ver" && test "$cfg_ver" = "$agent_ver" && test "$cfg_ver" = "$hub_ver"
      - run: npm run build:portable
      - run: npm run adapter:test
      - name: Run Hub, Miniflare workerd E2E & TypeScript SDK tests with V8 coverage
        run: node scripts/run-tests.mjs --coverage --include-sdk
      - run: npm run type-check
      - run: npm run deploy:dry
      - name: Run Deno Deploy Hub OTLP & SafeFetch smoke tests (SHA-256 verified Deno v2.2.4)
        run: |
          set -euo pipefail
          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT
          curl -fsSL -o "$tmp_dir/deno.zip" https://github.com/denoland/deno/releases/download/v2.2.4/deno-x86_64-unknown-linux-gnu.zip
          echo "9a260a624cab6e61f7603957f94f638d68739d8c6ac8c38bc337521266603a7c  $tmp_dir/deno.zip" | sha256sum -c -
          python3 -m zipfile -e "$tmp_dir/deno.zip" "$tmp_dir"
          chmod +x "$tmp_dir/deno"
          node --input-type=module -e '
            import { buildSync } from "esbuild";
            buildSync({
              entryPoints: ["test/deno-server.test.ts"],
              bundle: true,
              platform: "node",
              target: "es2022",
              format: "esm",
              banner: { js: "import { createRequire as __efCR } from \"node:module\"; const require = __efCR(import.meta.url);" },
              alias: { "cloudflare:workers": "./portable/cloudflare-shim.ts" },
              loader: { ".sql": "text", ".yaml": "text", ".yml": "text" },
              external: ["node:*"],
              outfile: process.argv[1],
            });
          ' "$tmp_dir/deno-server.test.mjs"
          "$tmp_dir/deno" test --no-check -A "$tmp_dir/deno-server.test.mjs"
      - name: Run Extraction & Token-Efficiency Fidelity Benchmark
        working-directory: .
        run: node bench/run-bench.mjs
      - name: Run Python SDK unit tests
        working-directory: sdk/py
        run: python3 test_edgefetch_client.py
      - name: Run Cross-Process Full-Stack OTLP & RFC 9421 E2E
        working-directory: .
        run: node --test --test-force-exit test/fullstack-otel.e2e.mjs
      - name: Run Opaque-Box Requirement E2E Audit Matrix
        working-directory: .
        run: node --test --test-force-exit test/e2e-audit-matrix.test.mjs
      - name: Verify Home Assistant Add-on CHANGELOG.md sync & version header
        working-directory: .
        run: |
          if ! cmp -s CHANGELOG.md edgefetch_fat/CHANGELOG.md; then
            echo "ERROR: edgefetch_fat/CHANGELOG.md is out of sync with root CHANGELOG.md (run: cp CHANGELOG.md edgefetch_fat/CHANGELOG.md)"
            exit 1
          fi
          ha_ver=$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' edgefetch_fat/config.yaml)
          if ! grep -Fq "## [${ha_ver}]" edgefetch_fat/CHANGELOG.md; then
            echo "ERROR: edgefetch_fat/CHANGELOG.md is missing release heading '## [${ha_ver}]' for config.yaml version ${ha_ver}"
            exit 1
          fi

  docker-multiarch:
    name: Verify Multi-Arch Distroless Builds (amd64 & arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build server, all-in-one & HAOS add-on images + live AppArmor, Dumpable & UID-isolation smoke tests
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile .
          docker buildx build --platform linux/amd64 -f Dockerfile.agent .
          docker buildx build --load --platform linux/amd64 -t edgefetch-aio:smoke -f Dockerfile.all-in-one .
          docker buildx build --load --platform linux/amd64 -t edgefetch-ci:smoke -f edgefetch_fat/Dockerfile .
          sed 's/^profile edgefetch_fat/profile c3b8e9a1_edgefetch_fat/' edgefetch_fat/apparmor.txt > /tmp/haos_edgefetch_fat.apparmor
          sudo apparmor_parser -r /tmp/haos_edgefetch_fat.apparmor
          mkdir -p /tmp/ef-ha-data /tmp/ef-aio-data
          chmod 0755 /tmp/ef-ha-data
          printf '{"hub_url":"https://example.com","agent_token":"0123456789abcdef0123456789abcdef","site_id":"ci-node"}' > /tmp/ef-ha-data/options.json
          chmod 0644 /tmp/ef-ha-data/options.json
          docker run -d --rm --name ef-smoke \
            --security-opt apparmor=c3b8e9a1_edgefetch_fat \
            --security-opt no-new-privileges:false \
            -v /tmp/ef-ha-data:/data \
            -e EDGEFETCH_SERVER_TOKEN=ci-smoke-token-0123456789abcdef \
            -p 127.0.0.1:18080:8080 \
            --entrypoint /edgefetch \
            edgefetch-ci:smoke --mode=server --addr=0.0.0.0:8080
          trap 'sudo dmesg | grep -i edgefetch_fat || true; docker logs ef-smoke || true; docker stop ef-smoke || true; docker logs ef-aio-smoke 2>/dev/null || true; docker stop ef-aio-smoke 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18080/healthz >/dev/null && break
            sleep 0.5
          done
          # Verify PID 1 AppArmor label (`enforce`), dropped UID 65532, NoNewPrivs=1, and PR_SET_DUMPABLE=0 (`/proc/<pid>/environ` unreadable by UID 65532)!
          ef_pid=$(docker inspect -f '{{.State.Pid}}' ef-smoke)
          ef_attr=$(sudo cat "/proc/${ef_pid}/attr/current")
          ef_status=$(sudo grep -E '^(Uid|Gid|NoNewPrivs):' "/proc/${ef_pid}/status")
          ef_env_owner=$(sudo stat -c '%u:%g' "/proc/${ef_pid}/environ")
          echo "=== ef-smoke /proc/1/attr/current: ${ef_attr} | environ owner: ${ef_env_owner} ==="
          echo "${ef_status}"
          echo "${ef_attr}" | grep -q 'edgefetch_fat (enforce)'
          echo "${ef_status}" | grep -Eq '^Uid:[[:space:]]+65532([[:space:]]+65532){3}$'
          echo "${ef_status}" | grep -Eq '^NoNewPrivs:[[:space:]]+1$'
          test "${ef_env_owner}" = "0:0"
          # Positive control: prove setpriv executes as numeric UID 65532 (unlike `sudo -u '#65532'`, which fails when 65532 is absent from /etc/passwd).
          test "$(sudo setpriv --reuid=65532 --regid=65532 --clear-groups id -u)" = "65532"
          sudo setpriv --reuid=65532 --regid=65532 --clear-groups cat /etc/hostname >/dev/null
          if sudo setpriv --reuid=65532 --regid=65532 --clear-groups cat "/proc/${ef_pid}/environ" >/dev/null 2>&1; then
            echo "ERROR: environ readable by 65532"
            exit 1
          fi
          if sudo setpriv --reuid=65532 --regid=65532 --clear-groups cat "/proc/${ef_pid}/task/${ef_pid}/environ" >/dev/null 2>&1; then
            echo "ERROR: task environ readable by 65532"
            exit 1
          fi
          # Verify LockDownSecretPaths locked /data (0700 0:0) and /data/options.json (0600 0:0) so UID 65532 cannot read it!
          test "$(sudo stat -c '%a %u:%g' /tmp/ef-ha-data)" = "700 0:0"
          test "$(sudo stat -c '%a %u:%g' /tmp/ef-ha-data/options.json)" = "600 0:0"
          if sudo setpriv --reuid=65532 --regid=65532 --clear-groups cat /tmp/ef-ha-data/options.json >/dev/null 2>&1; then
            echo "SECURITY FAILURE: UID 65532 was able to read /data/options.json!"
            exit 1
          fi
          resp=$(curl -fsS -H "Authorization: Bearer ci-smoke-token-0123456789abcdef" \
            -H "Content-Type: application/json" \
            -d '{"maxSeconds":45,"options":{"includeBody":false,"timeoutMs":35000},"requests":[{"id":"smoke","url":"https://example.com/","kind":"render","formats":["markdown"],"interact":{"actions":[{"type":"wait","selector":"p","waitMs":5000}]}},{"id":"webgl","url":"https://get.webgl.org/","kind":"render","formats":["markdown"],"waitForMs":2500}]}' \
            http://127.0.0.1:18080/fetch)
          echo "$resp"
          if sudo dmesg | grep -qi 'apparmor="DENIED".*edgefetch_fat'; then
            sudo dmesg | grep -i 'edgefetch_fat' || true
            exit 1
          fi
          echo "$resp" | grep -q '"id":"smoke".*"outcome":"ok"'
          echo "$resp" | grep -q '"id":"webgl".*"outcome":"ok"'

          # Smoke-test Dockerfile.all-in-one H3 UID isolation: Hub runs as node (1000), worker runs as 65532,
          # and UID 65532 gets Permission denied reading /proc/<hub_pid>/environ and /data/hub!
          docker run -d --rm --name ef-aio-smoke \
            -v /tmp/ef-aio-data:/data \
            -e CALLER_TOKEN=ci-aio-caller-token-0123456789abcdef \
            -e OPENAI_API_KEY=sk-ci-hub-only-secret-do-not-leak \
            -p 127.0.0.1:18787:8787 \
            edgefetch-aio:smoke
          for i in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer ci-aio-caller-token-0123456789abcdef" http://127.0.0.1:18787/agents 2>/dev/null | grep -q '"local-fat-1"'; then
              break
            fi
            sleep 0.5
          done
          curl -fsS -H "Authorization: Bearer ci-aio-caller-token-0123456789abcdef" http://127.0.0.1:18787/agents | grep -q '"local-fat-1"'
          hub_pid=$(docker exec ef-aio-smoke sh -c 'for f in /proc/[0-9]*/cmdline; do p="${f%/cmdline}"; p="${p#/proc/}"; [ "$p" = "$$" ] && continue; argv0=$(tr "\0" "\n" < "$f" 2>/dev/null | sed -n "1p"); argv1=$(tr "\0" "\n" < "$f" 2>/dev/null | sed -n "2p"); case "$argv0:$argv1" in *node*:*portable-server.mjs*) echo "$p"; break ;; esac; done')
          agent_pid=$(docker exec ef-aio-smoke sh -c 'for f in /proc/[0-9]*/cmdline; do p="${f%/cmdline}"; p="${p#/proc/}"; [ "$p" = "$$" ] && continue; argv0=$(tr "\0" "\n" < "$f" 2>/dev/null | sed -n "1p"); case "$argv0" in */edgefetch|edgefetch) echo "$p"; break ;; esac; done')
          echo "=== ef-aio-smoke hub_pid=${hub_pid} agent_pid=${agent_pid} ==="
          if [ -z "${hub_pid}" ] || [ -z "${agent_pid}" ]; then exit 1; fi
          docker exec ef-aio-smoke grep -E '^(Uid|Gid|NoNewPrivs):' "/proc/${hub_pid}/status"
          docker exec ef-aio-smoke grep -E '^(Uid|Gid|NoNewPrivs):' "/proc/${agent_pid}/status"
          docker exec ef-aio-smoke grep -Eq '^Uid:[[:space:]]+1000([[:space:]]+1000){3}$' "/proc/${hub_pid}/status"
          docker exec ef-aio-smoke grep -Eq '^Uid:[[:space:]]+65532([[:space:]]+65532){3}$' "/proc/${agent_pid}/status"
          test "$(docker exec -u 65532:65532 ef-aio-smoke id -u)" = "65532"
          if docker exec -u 65532:65532 ef-aio-smoke cat "/proc/${hub_pid}/environ" >/dev/null 2>&1; then exit 1; fi
          if docker exec -u 65532:65532 ef-aio-smoke ls /data >/dev/null 2>&1; then exit 1; fi
          if docker exec -u 65532:65532 ef-aio-smoke ls /data/hub >/dev/null 2>&1; then exit 1; fi
          docker stop ef-aio-smoke
