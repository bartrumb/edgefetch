name: Publish Multi-Arch Agent & Home Assistant Add-on Images (GHCR)

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'edgefetch_fat/**'
      - 'Dockerfile'
      - 'Dockerfile.agent'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/addon-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish-ha-addon:
    name: Build & Push ${{ matrix.image_prefix }}-${{ matrix.ha_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon_dir: edgefetch_fat
            image_prefix: edgefetch-fat-addon
            platform: linux/amd64
            ha_arch: amd64
            runner: ubuntu-latest
          - addon_dir: edgefetch_fat
            image_prefix: edgefetch-fat-addon
            platform: linux/arm64
            ha_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract Add-on Version from ${{ matrix.addon_dir }}/config.yaml
        id: meta
        run: |
          ver=$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' "${{ matrix.addon_dir }}/config.yaml")
          if [ -z "$ver" ]; then
            echo "Failed to read version from ${{ matrix.addon_dir }}/config.yaml"
            exit 1
          fi
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/${{ matrix.image_prefix }}-${{ matrix.ha_arch }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push add-on image (${{ matrix.addon_dir }})
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.addon_dir }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            io.hass.version=${{ steps.meta.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.ha_arch }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-standalone-multiarch:
    name: Publish Multi-Arch OCI Agent Images (latest & lite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read Version & Owner
        id: meta
        run: |
          ver=$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' edgefetch_fat/config.yaml)
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/edgefetch-agent" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Multi-Arch Fat Agent (amd64 + arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}

      - name: Build & Push Multi-Arch Distroless Lite Agent (amd64 + arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:lite
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-lite

      - name: Build & Push Multi-Arch All-in-One Hub + Agent Container (amd64 + arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.all-in-one
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/edgefetch:latest
            ghcr.io/${{ github.repository_owner }}/edgefetch:${{ steps.meta.outputs.version }}
