# Shared Go + TypeScript Declarative Site Adapter: Public Open Job Feeds
# Note: remotive.com is intentionally excluded because remotive.com/robots.txt disallows /api/remote-jobs.
id: public-job-feeds
name: "Public Open Job Feeds (WWR, Himalayas, Working Nomads, The Muse, Jobicy, Arbeitnow & RemoteOK)"
category: jobs
description: "Formats robots.txt-allowed keyless public job feeds (We Work Remotely RSS, Himalayas, Working Nomads, The Muse, Jobicy, Arbeitnow, and RemoteOK) into clean job tables."
domains:
  - weworkremotely.com
  - www.weworkremotely.com
  - himalayas.app
  - www.himalayas.app
  - www.workingnomads.com
  - workingnomads.com
  - www.themuse.com
  - themuse.com
  - jobicy.com
  - www.arbeitnow.com
  - arbeitnow.com
  - remoteok.com
exampleUrls:
  - "https://weworkremotely.com/remote-jobs.rss"
  - "https://himalayas.app/jobs/api?limit=50"
  - "https://www.workingnomads.com/api/exposed_jobs/"
  - "https://www.themuse.com/api/public/jobs?page=1"
  - "https://jobicy.com/api/v2/remote-jobs?count=20"
  - "https://www.arbeitnow.com/api/job-board-api"
  - "https://remoteok.com/api"

routes:
  # 1a. We Work Remotely RSS (*.rss)
  - match:
      hosts:
        - weworkremotely.com
        - www.weworkremotely.com
      pathSuffix: .rss
    twin:
      id: weworkremotely-feed
      fetchUrl: "{requestUrl}"
      kind: text
      accept: application/rss+xml
    extract:
      xml:
        mode: items_table
        requireAnyTags:
          - rss
          - channel
        itemTag: item
        titleTemplate: "We Work Remotely Jobs ({itemCount})"
        limit: 50
        collectLinkVar: jLink
        emitTotals: true
        itemVars:
          company:
            tags: [title]
            splitColonPart: 0
            default: "We Work Remotely"
          role:
            tags: [title]
            splitColonPart: 1
            default: Role
          jLink:
            tags: [link]
          region:
            tags: [region]
            default: Remote
          category:
            tags: [category]
            default: "-"
          pubDate:
            tags: [pubDate]
          pubDisplay:
            tags: [pubDate, category]
            sliceMax: 16
            default: "-"
        recordFields:
          title: "{role}"
          company: "{company}"
          url: "{jLink}"
          region: "{region}"
          category: "{category}"
          postedAt: "{pubDate}"
          source: weworkremotely
        columns:
          - header: Role
            template: "[{role}]({jLink})"
          - header: Company
            template: "{company}"
          - header: Region
            template: "{region}"
          - header: Published
            template: "{pubDisplay}"

  # 1b. We Work Remotely HTML board upgrade (/remote-jobs -> /remote-jobs.rss)
  - match:
      hosts:
        - weworkremotely.com
        - www.weworkremotely.com
      pathEquals:
        - /remote-jobs
        - /remote-jobs/
    twin:
      id: weworkremotely-feed
      fetchUrl: "https://weworkremotely.com/remote-jobs.rss"
      kind: text
      accept: application/rss+xml
    extract:
      xml:
        mode: items_table
        requireAnyTags:
          - rss
          - channel
        itemTag: item
        titleTemplate: "We Work Remotely Jobs ({itemCount})"
        limit: 50
        collectLinkVar: jLink
        emitTotals: true
        itemVars:
          company:
            tags: [title]
            splitColonPart: 0
            default: "We Work Remotely"
          role:
            tags: [title]
            splitColonPart: 1
            default: Role
          jLink:
            tags: [link]
          region:
            tags: [region]
            default: Remote
          category:
            tags: [category]
            default: "-"
          pubDate:
            tags: [pubDate]
          pubDisplay:
            tags: [pubDate, category]
            sliceMax: 16
            default: "-"
        recordFields:
          title: "{role}"
          company: "{company}"
          url: "{jLink}"
          region: "{region}"
          category: "{category}"
          postedAt: "{pubDate}"
          source: weworkremotely
        columns:
          - header: Role
            template: "[{role}]({jLink})"
          - header: Company
            template: "{company}"
          - header: Region
            template: "{region}"
          - header: Published
            template: "{pubDisplay}"

  # 2a. Himalayas direct JSON API (/jobs/api?...)
  - match:
      hosts:
        - himalayas.app
        - www.himalayas.app
      pathPrefix: /jobs/api
    twin:
      id: himalayas-feed
      fetchUrl: "{requestUrl}"
      kind: json
      accept: application/json
    extract:
      vars:
        jobCount:
          paths: [jobs]
          format: array_len
        totalFmt:
          paths: [totalCount]
          format: int_comma
          fallbackTemplate: "{jobCount}"
      requireVars:
        - jobCount
      titleTemplate: "Himalayas Remote Jobs ({jobCount} of {totalFmt})"
      sections:
        - heading: ""
          arrayPath: jobs
          limit: 50
          emptyText: "No open positions currently listed."
          paginationMeta:
            totalPath: totalCount
            cursorMode: offset
          itemVars:
            jTitle:
              paths: [title]
              trim: true
              default: Role
            company:
              paths: [companyName]
              trim: true
              default: "-"
            appUrl:
              paths: [applicationLink]
              requireHttps: true
            guidUrl:
              paths: [guid]
              requireHttps: true
            jUrl:
              template: "{appUrl}"
              whenVars: [appUrl]
              fallbackVar: guidUrl
            locs:
              paths: [locationRestrictions]
              join: ", "
              default: Worldwide
            cur:
              paths: [currency]
              trim: true
              default: USD
            minSal:
              paths: [minSalary]
              format: int_comma
              excludeEquals: "0"
            maxSal:
              paths: [maxSalary]
              format: int_comma
              excludeEquals: "0"
            salRange:
              template: "{cur} {minSal}–{maxSal}"
              whenVars: [minSal, maxSal]
            salMinOnly:
              template: "{cur} {minSal}"
              whenVars: [minSal]
            sal:
              template: "{salRange}"
              whenVars: [salRange]
              fallbackVar: salMinOnly
              default: "-"
            roleCell:
              template: "[{jTitle}]({jUrl})"
              whenVars: [jUrl]
              fallbackVar: jTitle
          collectLinkVars:
            - jUrl
          recordFields:
            title: "{jTitle}"
            company: "{company}"
            url: "{jUrl}"
            locations: "{locs}"
            salary: "{sal}"
            source: himalayas
          columns:
            - header: Role
              template: "{roleCell}"
            - header: Company
              template: "{company}"
            - header: Region
              template: "{locs}"
            - header: Salary
              template: "{sal}"

