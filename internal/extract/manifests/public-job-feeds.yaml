      vars:
        jobCount:
          paths: [jobs]
          format: array_len
      requireVars:
        - jobCount
      titleTemplate: "Working Nomads Remote Jobs ({jobCount})"
      sections:
        - heading: ""
          arrayPath: jobs
          limit: 50
          emptyText: "No open positions currently listed."
          paginationMeta:
            cursorMode: offset
          itemVars:
            jTitle:
              paths: [title]
              trim: true
              default: Role
            company:
              paths: [company_name]
              trim: true
              default: "-"
            jUrl:
              paths: [url]
              requireHttps: true
            loc:
              paths: [location]
              trim: true
              default: Remote
            pub:
              paths: [pub_date]
              sliceMax: 10
              trim: true
              default: "-"
            roleCell:
              template: "[{jTitle}]({jUrl})"
              whenVars: [jUrl]
              fallbackVar: jTitle
          collectLinkVars:
            - jUrl
          recordFields:
            title: "{jTitle}"
            company: "{company}"
            url: "{jUrl}"
            location: "{loc}"
            postedAt: "{pub}"
            source: workingnomads
          columns:
            - header: Role
              template: "{roleCell}"
            - header: Company
              template: "{company}"
            - header: Location
              template: "{loc}"
            - header: Published
              template: "{pub}"

  # 3b. Working Nomads HTML board upgrade (/jobs -> /api/exposed_jobs/)
  - match:
