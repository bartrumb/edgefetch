name: Release Binaries & Multi-Arch Container Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    name: Build, Sign & Attest Release Archives (GoReleaser + Ed25519 + SLSA)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cryptographically Sign checksums.txt with Owner Release Key (Ed25519)
        if: env.RELEASE_SIGNING_PRIVATE_KEY != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_tmp=$(mktemp)
          trap 'rm -f "$key_tmp"' EXIT
          chmod 600 "$key_tmp"
          printf '%s\n' "$RELEASE_SIGNING_PRIVATE_KEY" > "$key_tmp"
          openssl pkeyutl -sign -inkey "$key_tmp" -rawin -in dist/checksums.txt -out dist/checksums.txt.sig
          openssl pkeyutl -verify -pubin -inkey keys/release-signing-pub.pem -rawin -in dist/checksums.txt -sigfile dist/checksums.txt.sig
          gh release upload "${GITHUB_REF_NAME}" dist/checksums.txt.sig keys/release-signing-pub.pem --clobber

      - name: Generate SLSA Build Provenance Attestations for Release Binaries
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  ghcr-release:
    name: Publish & Attest GHCR Images (agent:latest, agent:lite & all-in-one)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Determine Version & Registry Owner
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
          else
            ver=$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' edgefetch_fat/config.yaml)
          fi
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Fat Agent (ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch-agent:latest)
        id: push-fat
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch-agent:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch-agent:${{ steps.meta.outputs.version }}

      - name: Attest Fat Agent OCI Image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch-agent
          subject-digest: ${{ steps.push-fat.outputs.digest }}
          push-to-registry: true

      - name: Build & Push Distroless Lite Agent (ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch-agent:lite)
        id: push-lite
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch-agent:lite
            ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch-agent:${{ steps.meta.outputs.version }}-lite

      - name: Attest Distroless Lite OCI Image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch-agent
          subject-digest: ${{ steps.push-lite.outputs.digest }}
          push-to-registry: true

      - name: Build & Push All-in-One Container (ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch:latest)
        id: push-aio
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.all-in-one
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch:${{ steps.meta.outputs.version }}

      - name: Attest All-in-One OCI Image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch
          subject-digest: ${{ steps.push-aio.outputs.digest }}
          push-to-registry: true
