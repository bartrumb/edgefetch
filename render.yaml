# Render.com 1-Click Blueprint (`https://render.com/deploy?repo=https://github.com/bartrumb/edgefetch`)
services:
  - type: web
    name: edgefetch-hub
    runtime: docker
    dockerfilePath: ./Dockerfile.all-in-one
    healthCheckPath: /health
    disk:
      name: edgefetch-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: PORT
        value: "8787"
      - key: EDGEFETCH_DATA_DIR
        value: "/data"
      - key: EDGEFETCH_TRUST_PROXY
        value: "1"
      # Set EDGEFETCH_PUBLIC_ORIGIN to your public Render URL or custom domain (falls back to RENDER_EXTERNAL_URL in all-in-one-entrypoint.sh).
      - key: EDGEFETCH_PUBLIC_ORIGIN
        value: "https://edgefetch-hub.onrender.com"
      # Managed Render container hypervisors block `CLONE_NEWUSER` and do not accept custom seccomp profiles; opt in explicitly.
      - key: EDGEFETCH_ALLOW_NO_SANDBOX
        value: "1"
      - key: CALLER_TOKEN
        generateValue: true
      - key: AGENT_TOKEN
        generateValue: true
