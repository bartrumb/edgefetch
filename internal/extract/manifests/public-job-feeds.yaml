  # 7. RemoteOK (/api, /, or /remote-<catTag>-jobs -> skips index-0 legal notice via requireField: position)
  - match:
      anyOf:
        - hosts:
            - remoteok.com
          pathSegments: []
        - hosts:
            - remoteok.com
          pathSegments:
            - api
        - hosts:
            - remoteok.com
          pathPrefix: /remote-
          pathSuffix: -jobs
          pathSegments:
            - param: catTag
              charset: alnum_dash
              stripPrefix: remote-
              stripSuffix: -jobs
              transform: lower
        - hosts:
            - remoteok.com
          pathPrefix: /remote-
          pathSuffix: -jobs/
          pathSegments:
            - param: catTag
              charset: alnum_dash
              stripPrefix: remote-
              stripSuffix: -jobs
              transform: lower
    twin:
      id: remoteok-feed
      fetchUrl: "https://remoteok.com/api"
      kind: json
      accept: application/json
    extract:
      wrapRootArrayAs: jobs
      vars:
        rawCount:
          paths: [jobs]
          format: array_len
        dedupCount:
          default: "{dedupCount}"
      requireVars:
        - rawCount
      titleTemplate: "RemoteOK Remote Jobs ({dedupCount})"
      sections:
        - heading: ""
          arrayPath: jobs
          limit: 50
          emptyText: "No open positions currently listed."
          filter:
            requireField: position
            tagFilterParam:
              param: catTag
              skipIfEquals: dev
              tagsField: tags
          itemVars:
            pos:
              paths: [position]
              trim: true
              default: Role
            jUrl:
              paths: [url]
              requireHttps: true
            company:
              paths: [company]
              trim: true
              default: "-"
            loc:
              paths: [location]
              trim: true
              default: Remote
            salMin:
              paths: [salary_min]
              excludeEquals: "0"
            salMax:
              paths: [salary_max]
              excludeEquals: "0"
            salRange:
              template: "${salMin}–${salMax}"
              whenVars: [salMin, salMax]
            salMinOnly:
              template: "${salMin}"
              whenVars: [salMin]
            sal:
              template: "{salRange}"
              whenVars: [salRange]
              fallbackVar: salMinOnly
              default: "-"
            roleCell:
              template: "[{pos}]({jUrl})"
              whenVars: [jUrl]
              fallbackVar: pos
          collectLinkVars:
            - jUrl
          columns:
            - header: Role
              template: "{roleCell}"
            - header: Company
              template: "{company}"
            - header: Location
              template: "{loc}"
            - header: Salary
              template: "{sal}"
