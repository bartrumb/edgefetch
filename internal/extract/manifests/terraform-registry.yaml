          whenVar: downloads
        - label: Published
          template: "{publishedAt}"
          whenVar: publishedAt
        - label: Source
          template: "{source}"
          whenVar: source
      bodyVar: readme
      sections:
        - heading: Inputs
          arrayPath: root.inputs
          limit: 60
          columns:
            - header: Name
              paths:
                - name
              code: true
            - header: Type
              paths:
                - type
              code: true
            - header: Required
              paths:
                - required
            - header: Description
              paths:
                - description
        - heading: Outputs
