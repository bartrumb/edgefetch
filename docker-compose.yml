# Zero-Cloud Local Stack (`docker compose up --build`)
# Launches the full EdgeFetch Hub (`/admin`, OAuth 2.1, 14-tool `/mcp`, SQLite FTS5, `/data` artifacts) bound strictly
# to loopback `http://127.0.0.1:8787` plus 2 multi-node Go worker containers (`node-1`, `node-2`) — zero cloud account needed!
#
# Quickstart:
#   export CALLER_TOKEN="$(openssl rand -hex 24)"
#   export AGENT_TOKEN="$(openssl rand -hex 24)"
#   docker compose up --build -d
services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile.all-in-one
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PORT: "8787"
      # Direct loopback stack: keep EDGEFETCH_TRUST_PROXY=0 (untrusted) by default so local callers cannot spoof X-Forwarded-For.
      # Set EDGEFETCH_TRUST_PROXY=1 ONLY when placing this container behind a trusted reverse proxy (Caddy/Nginx/Traefik/ALB)
      # that sanitizes or appends the real client IP as the rightmost X-Forwarded-For hop.
      EDGEFETCH_TRUST_PROXY: ${EDGEFETCH_TRUST_PROXY:-0}
      EDGEFETCH_PUBLIC_ORIGIN: ${EDGEFETCH_PUBLIC_ORIGIN:-http://127.0.0.1:8787}
      EDGEFETCH_DISABLE_LOCAL_AGENT: "1"
      CALLER_TOKEN: ${CALLER_TOKEN:?Set CALLER_TOKEN (>=24 random chars), e.g. export CALLER_TOKEN=$(openssl rand -hex 24)}
      AGENT_TOKEN: ${AGENT_TOKEN:?Set AGENT_TOKEN (>=24 random chars), e.g. export AGENT_TOKEN=$(openssl rand -hex 24)}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    volumes:
      - edgefetch-hub-data:/data

  agent-1:
    build:
      context: .
      dockerfile: Dockerfile.agent
    depends_on:
      - hub
    security_opt:
      - seccomp=./deploy/seccomp/chromium-sandbox.json
      - no-new-privileges:true
    environment:
      EDGEFETCH_ALLOW_INSECURE_DOCKER_HUB: "1"
      EDGEFETCH_HUB_URL: ws://hub:8787/agent/ws
      EDGEFETCH_AGENT_TOKEN: ${AGENT_TOKEN:?Set AGENT_TOKEN (>=24 random chars)}
      EDGEFETCH_SITE_ID: local-node-1
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

  agent-2:
    build:
      context: .
      dockerfile: Dockerfile.agent
    depends_on:
      - hub
    security_opt:
      - seccomp=./deploy/seccomp/chromium-sandbox.json
      - no-new-privileges:true
    environment:
      EDGEFETCH_ALLOW_INSECURE_DOCKER_HUB: "1"
      EDGEFETCH_HUB_URL: ws://hub:8787/agent/ws
      EDGEFETCH_AGENT_TOKEN: ${AGENT_TOKEN:?Set AGENT_TOKEN (>=24 random chars)}
      EDGEFETCH_SITE_ID: local-node-2
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

volumes:
  edgefetch-hub-data:
