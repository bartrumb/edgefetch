# Shared Go + TypeScript Declarative Site Adapter: Wikipedia & MediaWiki Encyclopedias
id: mediawiki
name: "Wikipedia & MediaWiki Encyclopedias"
category: commerce-social
description: "Robots-compliant Wikipedia & MediaWiki adapter: strips [ ], Edit links, [n] citation markers, [edit], and navigation chrome with 24h article caching; pair with search({ query, wikipedia: true, lang }) for Special:Search-free article discovery and Wikimedia Enterprise or dumps.wikimedia.org for bulk corpus access."
domains:
  - "*.wikipedia.org"
  - wiki.archlinux.org
universalEngine: true
exampleUrls:
  - https://en.wikipedia.org/wiki/HTTP/2

# Post-fetch Markdown cleanup preset for Wikipedia and MediaWiki installations
htmlRoutes:
  - id: mediawiki
    match:
      exactSegments: false
    mode: markdown_clean
    cleanPreset: mediawiki
