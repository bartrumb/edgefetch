# Shared Go + TypeScript Declarative Site Adapter: Greenhouse & Lever Whole-Board + EU APIs
id: greenhouse-lever-boards
name: "Greenhouse & Lever Whole-Board + EU APIs"
category: jobs
description: "Upgrades Greenhouse (US & EU) and Lever (US & EU) board root URLs to their official JSON posting feeds with truncation metadata."
domains:
  - boards.greenhouse.io
  - job-boards.greenhouse.io
  - eu-boards.greenhouse.io
  - job-boards.eu.greenhouse.io
  - jobs.lever.co
  - jobs.eu.lever.co
exampleUrls:
  - "https://job-boards.greenhouse.io/cloudflare"
  - "https://eu-boards.greenhouse.io/celonis"
  - "https://jobs.lever.co/mistral"

routes:
  # 1. Greenhouse US whole-board API
  - match:
      hosts:
        - boards.greenhouse.io
        - job-boards.greenhouse.io
      pathSegments:
        - param: org
          charset: pkg
          maxLen: 80
          reserved:
            - embed
            - v1
            - api
            - static
            - assets
            - favicon.ico
    twin:
      id: greenhouse-board
      fetchUrl: "https://boards-api.greenhouse.io/v1/boards/{org}/jobs"
      kind: json
      accept: application/json
    extract:
      vars:
        jobCount:
          paths: [jobs]
          format: array_len
        total:
          paths: [meta.total]
          fallbackTemplate: "{jobCount}"
      requireVars:
        - jobCount
      titleTemplate: "{org} — Greenhouse Job Board ({total} open roles)"
      sections:
        - heading: ""
          arrayPath: jobs
          limit: 120
          linkScanLimit: 2000
          emptyText: "No open positions currently listed."
          paginationMeta:
            totalPath: meta.total
            cursorMode: offset
          itemVars:
            jTitle:
              paths: [title]
              trim: true
              default: Role
            id:
              paths: [id]
            rawUrl:
              paths: [absolute_url]
              requireHttps: true
            jUrl:
              template: "{rawUrl}"
              whenVars: [rawUrl]
              fallbackTemplate: "https://{host}/{org}/jobs/{id}"
            dept:
              paths: [departments]
              subField: name
              join: ", "
              default: "-"
            loc:
              paths: [location.name]
              trim: true
              default: "-"
            updated:
              paths: [updated_at]
              sliceMax: 10
              trim: true
              default: "-"
          collectLinkVars:
            - jUrl
          columns:
            - header: Role
              template: "[{jTitle}]({jUrl})"
            - header: Department
              template: "{dept}"
            - header: Location
              template: "{loc}"
            - header: Updated
              template: "{updated}"

