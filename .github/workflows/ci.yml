name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go Vet, Race Detector & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Verify zero external Go dependencies (stdlib-only invariant)
        run: |
          if grep -q '^require' go.mod || [ -f go.sum ]; then
            echo "ERROR: go.mod must remain 100% standard-library only"
            exit 1
          fi

      - name: Check gofmt formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with ThreadSanitizer race detector (-race)
        run: go test -v -race -count=1 ./...

      - name: Run allocation microbenchmarks
        run: go test -bench=. -benchmem ./...

  hub:
    name: Cloudflare Hub Type-Check & Bundle Dry-Run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run type-check
      - run: npm run deploy:dry

  docker-multiarch:
    name: Verify Multi-Arch Distroless Builds (amd64 & arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server & HAOS add-on images across linux/amd64 + linux/arm64
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile .
          docker buildx build --platform linux/amd64,linux/arm64 -f edgefetch_agent/Dockerfile .
