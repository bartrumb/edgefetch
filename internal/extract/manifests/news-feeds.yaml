# Shared Go + TypeScript Declarative Site Adapter: Top News & Public Broadcaster Syndication Feeds
# Upgrades homepage and section hub URLs (strictly exact path segments so individual article URLs still scrape
# article HTML directly) to robots.txt-permitted HTTPS RSS 2.0 / RDF XML feeds.
id: news-feeds
name: "Top News & Public Broadcaster Feeds (NPR, BBC, CBS, NBC, ABC, Guardian, Al Jazeera, DW & Ars Technica)"
category: commerce-social
description: "Upgrades homepage and section landing URLs on NPR (including text.npr.org), BBC News, CBS News, NBC News, ABC News, The Guardian, Al Jazeera, DW, and Ars Technica to official robots.txt-allowed HTTPS RSS/RDF XML feeds."
domains:
  - www.npr.org
  - npr.org
  - text.npr.org
  - feeds.npr.org
  - www.bbc.com
  - bbc.com
  - www.bbc.co.uk
  - bbc.co.uk
  - feeds.bbci.co.uk
  - www.cbsnews.com
  - cbsnews.com
  - www.nbcnews.com
  - nbcnews.com
  - feeds.nbcnews.com
  - abcnews.go.com
  - www.theguardian.com
  - theguardian.com
  - www.aljazeera.com
  - aljazeera.com
  - www.dw.com
  - dw.com
  - rss.dw.com
  - arstechnica.com
  - www.arstechnica.com
  - feeds.arstechnica.com
exampleUrls:
  - "https://www.npr.org/"
  - "https://text.npr.org/"
  - "https://www.npr.org/sections/technology"
  - "https://www.bbc.com/news"
  - "https://www.bbc.co.uk/news/world"
  - "https://www.cbsnews.com/"
  - "https://www.nbcnews.com/news"
  - "https://abcnews.go.com/US"
  - "https://www.theguardian.com/world"
  - "https://www.aljazeera.com/news"
  - "https://www.dw.com/en"
  - "https://arstechnica.com/"

routes:
  # ── 1. NPR (www.npr.org, npr.org, text.npr.org -> feeds.npr.org) ───────────────────────────────
  - match:
      anyOf:
        - hosts: [www.npr.org, npr.org, text.npr.org]
          exactSegments: true
          maxSegments: 0
          defaults:
            feedLabel: "NPR Top News"
            feedSource: npr
        - hosts: [www.npr.org, npr.org, text.npr.org]
          exactSegments: true
          maxSegments: 2
          pathEquals: [/sections/news, /sections/news/]
          defaults:
            feedLabel: "NPR News"
            feedSource: npr
    twin:
      id: news-feeds
      fetchUrl: "https://feeds.npr.org/1001/rss.xml"
      kind: text
      accept: application/rss+xml
    extract:
      xml:
        mode: items_table
        requireAnyTags: [rss, channel, "rdf:rdf", feed]
        itemTag: item
        channelTitleFallbackParam: feedLabel
        titleTemplate: "{channelTitle} ({itemCount} stories)"
        emptyText: "No stories currently listed in feed."
        limit: 40
        requireItemVar: headline
        collectLinkVar: storyUrl
        emitTotals: true
        itemVars:
          headline:
            tags: [title]
            sliceMax: 200
          storyUrl:
            tags: [link, guid]
          summary:
            tags: [description, "content:encoded", summary]
            sliceMax: 280
            default: "-"
          published:
            tags: [pubDate, "dc:date", published, updated]
            sliceMax: 25
            default: "-"
        recordFields:
          title: "{headline}"
          url: "{storyUrl}"
          summary: "{summary}"
          publishedAt: "{published}"
          source: "{feedSource}"
        columns:
          - header: Story
            template: "[{headline}]({storyUrl})"
          - header: Summary
            template: "{summary}"
          - header: Published
            template: "{published}"

