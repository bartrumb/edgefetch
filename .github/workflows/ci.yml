name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go Vet, Staticcheck, Govulncheck, Race Detector & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Verify minimal dependency graph (only coder/websocket, zero transitive deps)
        run: |
          go mod verify
          extra=$(go mod graph | awk '$2 !~ /^github\.com\/coder\/websocket@v/ && $2 !~ /^go@/ && $2 !~ /^toolchain@/ { print $0 }')
          if [ -n "$extra" ]; then
            echo "ERROR: unexpected Go dependencies in module graph:"
            echo "$extra"
            exit 1
          fi

      - name: Check gofmt formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck & govulncheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Run tests with ThreadSanitizer race detector (-race)
        run: go test -v -race -count=1 ./...

      - name: Run allocation microbenchmarks
        run: go test -bench=. -benchmem ./...

  hub:
    name: Cloudflare Hub Type-Check & Bundle Dry-Run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: hub/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run type-check
      - run: npm run deploy:dry

  docker-multiarch:
    name: Verify Multi-Arch Distroless Builds (amd64 & arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build server & HAOS add-on images + live Alpine Chromium render smoke test
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile .
          docker buildx build --load --platform linux/amd64 -t edgefetch-ci:smoke -f edgefetch_fat/Dockerfile .
          docker run -d --rm --name ef-smoke -u 65532:65532 \
            --security-opt no-new-privileges:true \
            -e EDGEFETCH_SERVER_TOKEN=ci-smoke-token-0123456789abcdef \
            -p 127.0.0.1:18080:8080 \
            --entrypoint /edgefetch \
            edgefetch-ci:smoke --mode=server --addr=0.0.0.0:8080
          trap 'docker logs ef-smoke || true; docker stop ef-smoke || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18080/healthz >/dev/null && break
            sleep 0.5
          done
          resp=$(curl -fsS -H "Authorization: Bearer ci-smoke-token-0123456789abcdef" \
            -H "Content-Type: application/json" \
            -d '{"maxSeconds":30,"options":{"includeBody":false,"timeoutMs":25000},"requests":[{"id":"smoke","url":"https://example.com/","kind":"render","formats":["markdown"],"interact":{"actions":[{"type":"wait","selector":"h1","waitMs":3000}]}}]}' \
            http://127.0.0.1:18080/fetch)
          echo "$resp"
          echo "$resp" | grep -q '"outcome":"ok"'
          echo "$resp" | grep -q 'Example Domain'
