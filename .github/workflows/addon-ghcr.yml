name: Publish Multi-Arch Agent & Home Assistant Add-on Images (GHCR)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'addon/**'
      - 'Dockerfile'
      - 'Dockerfile.agent'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/addon-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tests:
    name: Gate Release Add-on Images on Go & Hub Test Suites
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: hub/package-lock.json

      - name: Run Go vet, staticcheck & race test suite
        run: |
          go vet ./...
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...
          go test -race ./...

      - name: Run Hub adapter check, unit/E2E tests, type-check & deploy dry-run
        working-directory: hub
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run adapter:check
          npm run psl:check
          npm test
          npm run type-check
          npm run deploy:dry

  publish-ha-addon:
    name: Build & Push ${{ matrix.image_prefix }}-${{ matrix.ha_arch }} (edge)
    runs-on: ${{ matrix.runner }}
    if: "!startsWith(github.ref, 'refs/tags/v')"
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon_dir: addon
            image_prefix: edgefetch-addon
            platform: linux/amd64
            ha_arch: amd64
            runner: ubuntu-24.04
          - addon_dir: addon
            image_prefix: edgefetch-addon
            platform: linux/arm64
            ha_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract Add-on Version & Edge Tags
        id: meta
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
          ADDON_DIR: ${{ matrix.addon_dir }}
          IMAGE_PREFIX: ${{ matrix.image_prefix }}
          HA_ARCH: ${{ matrix.ha_arch }}
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' "${ADDON_DIR}/config.yaml")
          agent_ver=$(sed -n 's/^var[[:space:]]\+Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' internal/agent/agent.go)
          hub_ver=$(node -p "require('./hub/package.json').version")
          if [ -z "$ver" ] || [ -z "$agent_ver" ] || [ -z "$hub_ver" ]; then
            echo "::error::Failed to extract version strings (config.yaml='${ver}', agent.go='${agent_ver}', hub/package.json='${hub_ver}')"
            exit 1
          fi
          if [ "$ver" != "$agent_ver" ] || [ "$ver" != "$hub_ver" ]; then
            echo "::error::Version lockstep mismatch: ${ADDON_DIR}/config.yaml='v${ver}', internal/agent/agent.go='v${agent_ver}', hub/package.json='v${hub_ver}'"
            exit 1
          fi
          if [[ "$REF" == refs/tags/* ]]; then
            if [ "$REF_NAME" != "v${ver}" ] || [ "$REF_NAME" != "v${agent_ver}" ] || [ "$REF_NAME" != "v${hub_ver}" ]; then
              echo "::error::Tag '${REF_NAME}' does not match repository version 'v${ver}'"
              exit 1
            fi
          fi
          owner=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/${IMAGE_PREFIX}-${HA_ARCH}"
          short_sha="${GITHUB_SHA::7}"
          echo "tags=${image}:edge,${image}:sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Home Assistant reads addon/config.yaml from the default branch, so it offers `X.Y.Z` as soon as a version bump
      # merges, but `:X.Y.Z` used to exist only after the `vX.Y.Z` tag ran (users saw `manifest unknown` / 404 in
      # between). Publish `:X.Y.Z` from the first main build that carries a new version; later main builds leave it
      # alone, and the tag's `publish-ha-addon-release` job replaces it with the test-gated release build.
      - name: Add versioned tag if this version is not published yet
        id: tags
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          BASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -uo pipefail
          inspect_out="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>&1)"
          inspect_rc=$?
          if [ "$inspect_rc" -eq 0 ]; then
            echo "${IMAGE}:${VERSION} already exists; publishing edge tags only."
            echo "tags=${BASE_TAGS}" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$inspect_out" | grep -qiE 'not found|manifest unknown|404'; then
            echo "${IMAGE}:${VERSION} not published yet; adding it so Home Assistant can pull this version now."
            echo "tags=${BASE_TAGS},${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            # Fail safe: an unrelated registry error must never let a main build overwrite a released image.
            echo "::warning title=Versioned add-on tag skipped::Could not determine whether ${IMAGE}:${VERSION} exists (${inspect_out}); publishing edge tags only."
            echo "tags=${BASE_TAGS}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push add-on image (${{ matrix.addon_dir }})
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.addon_dir }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            io.hass.version=${{ steps.meta.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.ha_arch }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-ha-addon-release:
    name: Build & Push ${{ matrix.image_prefix }}-${{ matrix.ha_arch }} (release)
    runs-on: ${{ matrix.runner }}
    needs: [verify-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon_dir: addon
            image_prefix: edgefetch-addon
            platform: linux/amd64
            ha_arch: amd64
            runner: ubuntu-24.04
          - addon_dir: addon
            image_prefix: edgefetch-addon
            platform: linux/arm64
            ha_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract Add-on Release Version & Tags
        id: meta
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
          ADDON_DIR: ${{ matrix.addon_dir }}
          IMAGE_PREFIX: ${{ matrix.image_prefix }}
          HA_ARCH: ${{ matrix.ha_arch }}
        run: |
          set -euo pipefail
          cfg_ver=$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' "${ADDON_DIR}/config.yaml")
          agent_ver=$(sed -n 's/^var[[:space:]]\+Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' internal/agent/agent.go)
          hub_ver=$(node -p "require('./hub/package.json').version")
          if [ -z "$cfg_ver" ] || [ -z "$agent_ver" ] || [ -z "$hub_ver" ]; then
            echo "::error::Failed to extract version strings (config.yaml='${cfg_ver}', agent.go='${agent_ver}', hub/package.json='${hub_ver}')"
            exit 1
          fi
          if [ "$cfg_ver" != "$agent_ver" ] || [ "$cfg_ver" != "$hub_ver" ]; then
            echo "::error::Version lockstep mismatch: ${ADDON_DIR}/config.yaml='v${cfg_ver}', internal/agent/agent.go='v${agent_ver}', hub/package.json='v${hub_ver}'"
            exit 1
          fi
          if [ "$REF_NAME" != "v${cfg_ver}" ] || [ "$REF_NAME" != "v${agent_ver}" ] || [ "$REF_NAME" != "v${hub_ver}" ]; then
            echo "::error::Tag '${REF_NAME}' does not match repository versions (config.yaml='v${cfg_ver}', agent.go='v${agent_ver}', hub/package.json='v${hub_ver}')"
            exit 1
          fi
          ver="$cfg_ver"
          owner=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/${IMAGE_PREFIX}-${HA_ARCH}"
          echo "tags=${image}:${ver},${image}:latest" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release add-on image (${{ matrix.addon_dir }})
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.addon_dir }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            io.hass.version=${{ steps.meta.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.ha_arch }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-standalone-multiarch:
    name: Publish Multi-Arch OCI Agent Images (edge)
    runs-on: ubuntu-24.04
    if: "!startsWith(github.ref, 'refs/tags/v')"
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Version, Owner & Tags
        id: meta
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' addon/config.yaml)
          agent_ver=$(sed -n 's/^var[[:space:]]\+Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' internal/agent/agent.go)
          hub_ver=$(node -p "require('./hub/package.json').version")
          if [ -z "$ver" ] || [ -z "$agent_ver" ] || [ -z "$hub_ver" ]; then
            echo "::error::Failed to extract version strings (config.yaml='${ver}', agent.go='${agent_ver}', hub/package.json='${hub_ver}')"
            exit 1
          fi
          if [ "$ver" != "$agent_ver" ] || [ "$ver" != "$hub_ver" ]; then
            echo "::error::Version lockstep mismatch: addon/config.yaml='v${ver}', internal/agent/agent.go='v${agent_ver}', hub/package.json='v${hub_ver}'"
            exit 1
          fi
          owner=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/edgefetch-agent"
          short_sha="${GITHUB_SHA::7}"
          if [[ "$REF" == refs/tags/v* ]]; then
            if [ "$REF_NAME" != "v${ver}" ] || [ "$REF_NAME" != "v${agent_ver}" ] || [ "$REF_NAME" != "v${hub_ver}" ]; then
              echo "::error::Tag '${REF_NAME}' does not match repository version 'v${ver}'"
              exit 1
            fi
            echo "browser_tags=${image}:latest,${image}:${ver}" >> "$GITHUB_OUTPUT"
            echo "lite_tags=${image}:lite,${image}:${ver}-lite" >> "$GITHUB_OUTPUT"
            echo "aio_tags=ghcr.io/${owner}/edgefetch:latest,ghcr.io/${owner}/edgefetch:${ver}" >> "$GITHUB_OUTPUT"
          else
            echo "browser_tags=${image}:edge,${image}:sha-${short_sha}" >> "$GITHUB_OUTPUT"
            echo "lite_tags=${image}:edge-lite,${image}:sha-${short_sha}-lite" >> "$GITHUB_OUTPUT"
            echo "aio_tags=ghcr.io/${owner}/edgefetch:edge,ghcr.io/${owner}/edgefetch:sha-${short_sha}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Multi-Arch Browser Agent (amd64 + arm64)
        id: push-browser
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.browser_tags }}

      - name: Attest Multi-Arch Browser Agent
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push-browser.outputs.digest }}
          push-to-registry: true

      - name: Build & Push Multi-Arch Distroless Lite Agent (amd64 + arm64)
        id: push-lite
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.lite_tags }}

      - name: Attest Multi-Arch Distroless Lite Agent
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push-lite.outputs.digest }}
          push-to-registry: true

      - name: Build & Push Multi-Arch All-in-One Hub + Agent Container (amd64 + arm64)
        id: push-aio
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.all-in-one
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.aio_tags }}

      - name: Attest Multi-Arch All-in-One Container
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch
          subject-digest: ${{ steps.push-aio.outputs.digest }}
          push-to-registry: true
