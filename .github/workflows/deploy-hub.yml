name: Deploy Cloudflare Hub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy EdgeFetch Hub Worker (hub/)
    if: >-
      (github.repository == 'bartrumb/edgefetch' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    environment: production
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: hub/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run adapter:compile
      - run: npm run psl:check
      - run: npm test
      - run: npm run type-check
      - run: npm run deploy:dry
      - name: Deploy Worker & AgentHubDO to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::notice title=Cloudflare Secret Not Set::CLOUDFLARE_API_TOKEN is not configured in environment 'production'; dry-run validation succeeded and live deploy was skipped."
            exit 0
          fi
          npm run deploy
