# Shared Go + TypeScript Declarative Site Adapter: Apple App Store
id: apple-app-store
name: Apple App Store
category: developer
description: "Extracts structured iOS/macOS App Store metadata (developer, rating, review count, price, category, version notes, and description)."
domains:
  - apps.apple.com
exampleUrls:
  - "https://apps.apple.com/us/app/cloudflare-one-agent/id6443476492"

# Post-fetch DOM + JSON-LD extraction on /<locale>/app/... pages
htmlRoutes:
  - match:
      pathContainsSegment: app
      minSegments: 2
    mode: dom
    jsonLdTypes:
      - SoftwareApplication
      - MobileApplication
      - WebApplication
    vars:
      title:
        jsonLdPaths:
          - name
        metaKeys:
          - "og:title"
        stripRegexSuffix: "\\s+on the App\\s*Store$"
        cssText:
          - h1
      developer:
        jsonLdPaths:
          - "author.name"
        cssText:
          - "h2.product-header__identity"
      ratingVal:
        jsonLdPaths:
          - "aggregateRating.ratingValue"
      ratingCount:
        jsonLdPaths:
          - "aggregateRating.reviewCount"
          - "aggregateRating.ratingCount"
      ratingOnly:
        template: "{ratingVal} / 5"
        whenVars:
          - ratingVal
      rating:
        template: "{ratingVal} / 5 ({ratingCount} ratings)"
        whenVars:
          - ratingVal
          - ratingCount
        fallbackVar: ratingOnly
      currency:
        jsonLdPaths:
          - "offers.0.priceCurrency"
          - "offers.priceCurrency"
        default: USD
      price:
        jsonLdPaths:
          - "offers.0.price"
          - "offers.price"
        format: free_or_currency
        currencyVar: currency
      category:
        jsonLdPaths:
          - applicationCategory
      osSys:
        jsonLdPaths:
          - operatingSystem
      desc:
        jsonLdPaths:
          - description
        metaKeys:
          - description
      descShort:
        template: "{desc}"
        whenVars:
          - desc
        sliceMax: 260
      version:
        regexExtract:
          source: clean_html
          pattern: "Version\\s+([0-9][0-9A-Za-z._-]*)"
          group: 1
    requireVars:
      - title
    requireBulletsOrVars:
      - desc
    titleTemplate: "{title}"
    descriptionVar: descShort
    authorVar: developer
    bullets:
      - label: Developer
        template: "{developer}"
        whenVar: developer
      - label: Category
        template: "{category}"
        whenVar: category
      - label: Rating
        template: "{rating}"
        whenVar: rating
      - label: Price
        template: "{price}"
        whenVar: price
      - label: Platform
        template: "{osSys}"
        whenVar: osSys
      - label: Latest Version
        template: "`{version}`"
        whenVar: version
    sections:
      - heading: Description
        textVar: desc
