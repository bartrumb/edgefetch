# Shared Go + TypeScript Declarative Site Adapter: PyPI Python Package Index
id: pypi-project
name: PyPI Python Package Index
category: developer
description: "Extracts PyPI package install command, summary, and project README from pypi.org/project/<pkg>/ (respecting robots.txt on /json)."
domains:
  - pypi.org
  - www.pypi.org
exampleUrls:
  - "https://pypi.org/project/httpx/"

# Post-fetch DOM extraction on /project/<pkg>/
htmlRoutes:
  - match:
      exactSegments: false
      pathSegments:
        - project
        - param: pkg
          charset: pkg
    mode: dom
    vars:
      headerName:
        cssText:
          - "h1.project-header__name"
          - "h1.package-header__name"
      pipCmd:
        cssText:
          - "#pip-command"
      summary:
        cssText:
          - "p.project-header__summary"
          - "p.package-description__summary"
      readme:
        cssHtmlToMd:
          - "#description"
          - "div.project-description"
        format: strip_leading_h1
    requireVars:
      - headerName
      - readme
    titleTemplate: "{headerName}"
    descriptionVar: summary
    introVar: summary
    bullets:
      - label: Install
        template: "`{pipCmd}`"
        whenVar: pipCmd
    bodyVar: readme
