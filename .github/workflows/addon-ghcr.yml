name: Publish Multi-Arch Agent & Home Assistant Add-on Images (GHCR)

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'edgefetch_fat/**'
      - 'Dockerfile'
      - 'Dockerfile.agent'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/addon-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish-ha-addon:
    name: Build & Push ${{ matrix.image_prefix }}-${{ matrix.ha_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon_dir: edgefetch_fat
            image_prefix: edgefetch-fat-addon
            platform: linux/amd64
            ha_arch: amd64
            runner: ubuntu-latest
          - addon_dir: edgefetch_fat
            image_prefix: edgefetch-fat-addon
            platform: linux/arm64
            ha_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract Add-on Version from ${{ matrix.addon_dir }}/config.yaml
        id: meta
        run: |
          ver=$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' "${{ matrix.addon_dir }}/config.yaml")
          if [ -z "$ver" ]; then
            echo "Failed to read version from ${{ matrix.addon_dir }}/config.yaml"
            exit 1
          fi
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/${{ matrix.image_prefix }}-${{ matrix.ha_arch }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push add-on image (${{ matrix.addon_dir }})
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.addon_dir }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            io.hass.version=${{ steps.meta.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.ha_arch }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-standalone-multiarch:
    name: Publish Multi-Arch OCI Agent Images (latest & lite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Version & Owner
        id: meta
        run: |
          ver=$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' edgefetch_fat/config.yaml)
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/edgefetch-agent" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Multi-Arch Fat Agent (amd64 + arm64)
        id: push-fat
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}

      - name: Attest Multi-Arch Fat Agent
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push-fat.outputs.digest }}
          push-to-registry: true

      - name: Build & Push Multi-Arch Distroless Lite Agent (amd64 + arm64)
        id: push-lite
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:lite
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-lite

      - name: Attest Multi-Arch Distroless Lite Agent
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push-lite.outputs.digest }}
          push-to-registry: true

      - name: Build & Push Multi-Arch All-in-One Hub + Agent Container (amd64 + arm64)
        id: push-aio
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.all-in-one
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch:${{ steps.meta.outputs.version }}

      - name: Attest Multi-Arch All-in-One Container
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch
          subject-digest: ${{ steps.push-aio.outputs.digest }}
          push-to-registry: true
