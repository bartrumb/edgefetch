name: Release Binaries & Multi-Arch Container Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build, Sign & Attest Release Archives (GoReleaser + Ed25519 + SLSA)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Tag & Repository Version Lockstep
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cfg_ver=$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' edgefetch_fat/config.yaml)
          agent_ver=$(sed -n 's/^var[[:space:]]\+Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' internal/agent/agent.go)
          hub_ver=$(node -p "require('./hub/package.json').version")
          mcp_ver=$(node -p "require('./server.json').version")
          mcp_pkg=$(node -p "require('./server.json').packages[0].identifier")
          if [ -z "$cfg_ver" ] || [ -z "$agent_ver" ] || [ -z "$hub_ver" ] || [ -z "$mcp_ver" ] || [ -z "$mcp_pkg" ]; then
            echo "::error::Failed to extract version strings (config.yaml='${cfg_ver}', agent.go='${agent_ver}', hub/package.json='${hub_ver}', server.json='${mcp_ver}')"
            exit 1
          fi
          if [ "$cfg_ver" != "$agent_ver" ] || [ "$cfg_ver" != "$hub_ver" ] || [ "$mcp_ver" != "$cfg_ver" ] || [ "$mcp_pkg" != "ghcr.io/bartrumb/edgefetch-agent:${cfg_ver}" ]; then
            echo "::error::Version lockstep mismatch: edgefetch_fat/config.yaml='v${cfg_ver}', internal/agent/agent.go='v${agent_ver}', hub/package.json='v${hub_ver}', server.json='v${mcp_ver}' (${mcp_pkg})"
            exit 1
          fi
          if [ "$REF_NAME" != "v${cfg_ver}" ] || [ "$REF_NAME" != "v${agent_ver}" ] || [ "$REF_NAME" != "v${hub_ver}" ]; then
            echo "::error::Tag '${REF_NAME}' does not match repository versions (config.yaml='v${cfg_ver}', agent.go='v${agent_ver}', hub/package.json='v${hub_ver}')"
            exit 1
          fi

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Build Release Archives Locally (Publish Held Until Signature Verified)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v6
        with:
          distribution: goreleaser
          version: 'v2.20.3'
          args: release --clean --skip=publish

      - name: Mandatory Ed25519 Signing & Atomic GitHub Release Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "ERROR: RELEASE_SIGNING_PRIVATE_KEY secret must be configured; refusing to publish unsigned release." >&2
            exit 1
          fi
          key_tmp=$(mktemp)
          trap 'rm -f "$key_tmp"' EXIT
          chmod 600 "$key_tmp"
          printf '%s\n' "$RELEASE_SIGNING_PRIVATE_KEY" > "$key_tmp"
          openssl pkeyutl -sign -inkey "$key_tmp" -rawin -in dist/checksums.txt -out dist/checksums.txt.sig
          openssl pkeyutl -verify -pubin -inkey keys/release-signing-pub.pem -rawin -in dist/checksums.txt -sigfile dist/checksums.txt.sig
          gh release create "$TAG_NAME" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/checksums.txt \
            dist/checksums.txt.sig \
            keys/release-signing-pub.pem \
            --verify-tag \
            --generate-notes

      - name: Generate SLSA Build Provenance Attestations for Release Binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/checksums.txt.sig

  ghcr-release:
    name: Publish & Attest GHCR Images (agent:latest, agent:lite & all-in-one)
    runs-on: ubuntu-latest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine Version, Floating Tags & Registry Owner
        id: meta
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          cfg_ver=$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' edgefetch_fat/config.yaml)
          agent_ver=$(sed -n 's/^var[[:space:]]\+Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' internal/agent/agent.go)
          hub_ver=$(node -p "require('./hub/package.json').version")
          mcp_ver=$(node -p "require('./server.json').version")
          mcp_pkg=$(node -p "require('./server.json').packages[0].identifier")
          if [ -z "$cfg_ver" ] || [ -z "$agent_ver" ] || [ -z "$hub_ver" ] || [ -z "$mcp_ver" ] || [ -z "$mcp_pkg" ]; then
            echo "::error::Failed to extract version strings (config.yaml='${cfg_ver}', agent.go='${agent_ver}', hub/package.json='${hub_ver}', server.json='${mcp_ver}')"
            exit 1
          fi
          if [ "$cfg_ver" != "$agent_ver" ] || [ "$cfg_ver" != "$hub_ver" ] || [ "$mcp_ver" != "$cfg_ver" ] || [ "$mcp_pkg" != "ghcr.io/bartrumb/edgefetch-agent:${cfg_ver}" ]; then
            echo "::error::Version lockstep mismatch: edgefetch_fat/config.yaml='v${cfg_ver}', internal/agent/agent.go='v${agent_ver}', hub/package.json='v${hub_ver}', server.json='v${mcp_ver}' (${mcp_pkg})"
            exit 1
          fi
          owner=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          if [[ "$REF" == refs/tags/v* ]]; then
            if [ "$REF_NAME" != "v${cfg_ver}" ] || [ "$REF_NAME" != "v${agent_ver}" ] || [ "$REF_NAME" != "v${hub_ver}" ]; then
              echo "::error::Tag '${REF_NAME}' does not match repository versions (config.yaml='v${cfg_ver}', agent.go='v${agent_ver}', hub/package.json='v${hub_ver}')"
              exit 1
            fi
            ver="$cfg_ver"
            echo "fat_tags=ghcr.io/${owner}/edgefetch-agent:latest,ghcr.io/${owner}/edgefetch-agent:${ver}" >> "$GITHUB_OUTPUT"
            echo "lite_tags=ghcr.io/${owner}/edgefetch-agent:lite,ghcr.io/${owner}/edgefetch-agent:${ver}-lite" >> "$GITHUB_OUTPUT"
            echo "aio_tags=ghcr.io/${owner}/edgefetch:latest,ghcr.io/${owner}/edgefetch:${ver}" >> "$GITHUB_OUTPUT"
          else
            ver="$cfg_ver"
            short_sha="${GITHUB_SHA::7}"
            echo "fat_tags=ghcr.io/${owner}/edgefetch-agent:edge,ghcr.io/${owner}/edgefetch-agent:sha-${short_sha}" >> "$GITHUB_OUTPUT"
            echo "lite_tags=ghcr.io/${owner}/edgefetch-agent:edge-lite,ghcr.io/${owner}/edgefetch-agent:sha-${short_sha}-lite" >> "$GITHUB_OUTPUT"
            echo "aio_tags=ghcr.io/${owner}/edgefetch:edge,ghcr.io/${owner}/edgefetch:sha-${short_sha}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Fat Agent (ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch-agent)
        id: push-fat
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.fat_tags }}

      - name: Attest Fat Agent OCI Image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch-agent
          subject-digest: ${{ steps.push-fat.outputs.digest }}
          push-to-registry: true

      - name: Build & Push Distroless Lite Agent (ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch-agent:lite)
        id: push-lite
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.lite_tags }}

      - name: Attest Distroless Lite OCI Image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch-agent
          subject-digest: ${{ steps.push-lite.outputs.digest }}
          push-to-registry: true

      - name: Build & Push All-in-One Container (ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch)
        id: push-aio
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.all-in-one
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.aio_tags }}

      - name: Attest All-in-One OCI Image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch
          subject-digest: ${{ steps.push-aio.outputs.digest }}
          push-to-registry: true

      - name: Publish server.json to Official MCP Registry (GitHub OIDC)
        if: github.repository == 'bartrumb/edgefetch' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL -o "$tmp/mcp-publisher.tar.gz" https://github.com/modelcontextprotocol/registry/releases/download/v1.8.11/mcp-publisher_linux_amd64.tar.gz
          echo "99fbd857ae2277e5e4a4a2cddc7f4d3e64612c6f90950f44584c3539c9df854f  $tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/mcp-publisher.tar.gz" -C "$tmp" mcp-publisher
          chmod +x "$tmp/mcp-publisher"
          "$tmp/mcp-publisher" validate server.json
          "$tmp/mcp-publisher" login github-oidc
          "$tmp/mcp-publisher" publish
