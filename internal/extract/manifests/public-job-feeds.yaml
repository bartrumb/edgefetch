      anyOf:
        - hosts:
            - jobicy.com
          pathEquals:
            - /jobs-rss-feed
            - /jobs-rss-feed/
        - hosts:
            - jobicy.com
          pathPrefix: /remote-
    twin:
      id: jobicy-feed
      fetchUrl: "https://jobicy.com/api/v2/remote-jobs?count=30"
      kind: json
      accept: application/json
    extract:
      vars:
        jobCount:
          paths: [jobs]
          format: array_len
