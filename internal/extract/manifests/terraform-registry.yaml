        name:
          paths:
            - name
        provider:
          paths:
            - provider
        version:
          paths:
            - version
        verified:
          paths:
            - verified
          format: bool_map
          trueValue: Verified
          falseValue: Unverified
        downloads:
          paths:
            - downloads
          format: int_comma
        publishedAt:
          paths:
            - published_at
          sliceMax: 10
        desc:
          paths:
            - description
          trim: true
        source:
          paths:
            - source
          requireHttps: true
        readme:
          paths:
            - root.readme
          format: demote_h1
          trim: true
      titleTemplate: "{namespace}/{name}/{provider} v{version} (Terraform Module)"
      descriptionVar: desc
      publishedTimeVar: publishedAt
      introVar: desc
      bullets:
        - label: Module
          template: "`{namespace}/{name}/{provider}`"
        - label: Version
          template: "`{version}`"
        - label: Status
          template: "{verified}"
          whenVar: verified
        - label: Downloads
