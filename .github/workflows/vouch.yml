name: Contributor DCO & Vouch Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  verify-contributor:
    name: Verify Vouched Contributor & DCO Sign-Off
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout trusted base commit only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Check VOUCHED.td allowlist & DCO sign-off
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid pull request metadata."
            exit 1
          fi
          author_lc="$(printf '%s' "$PR_AUTHOR" | tr '[:upper:]' '[:lower:]')"
          echo "Checking contributor: ${author_lc}"
          if ! git show "${BASE_SHA}:.github/VOUCHED.td" | grep -v '^[[:space:]]*#' | sed 's/[[:space:]]//g' | grep -Fxq "$author_lc"; then
            echo "::error::GitHub user '${PR_AUTHOR}' is not yet listed in .github/VOUCHED.td on the base branch. A maintainer will review your PR, verify robots.txt/test compliance, and vouch your handle."
            exit 1
          fi
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          fetched_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$fetched_sha" != "$HEAD_SHA" ]; then
            echo "::error::Fetched PR head (${fetched_sha}) did not match event HEAD_SHA (${HEAD_SHA}); re-run check on latest commit."
            exit 1
          fi
          if [ "$author_lc" != "bartrumb" ] && [ "$author_lc" != "dependabot[bot]" ] && [ "$author_lc" != "github-actions[bot]" ]; then
            commits="$(git rev-list "${BASE_SHA}..${HEAD_SHA}")"
            missing_dco=""
            if [ -n "$commits" ]; then
              while IFS= read -r sha; do
                [ -z "$sha" ] && continue
                author_name="$(git log -1 --format='%an' "$sha" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                author_email="$(git log -1 --format='%ae' "$sha" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')"
                committer_name="$(git log -1 --format='%cn' "$sha" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                committer_email="$(git log -1 --format='%ce' "$sha" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')"
                msg_body="$(git log -1 --format='%B' "$sha" | tr -d '\r')"
                trailers="$(printf '%s\n' "$msg_body" | awk '
                  { lines[NR] = $0 }
                  END {
                    end = NR
                    while (end > 0 && lines[end] ~ /^[[:space:]]*$/) end--
                    if (end <= 1) exit
                    start = end
                    while (start > 1 && lines[start] !~ /^[[:space:]]*$/) start--
                    if (start < 1 || lines[start] !~ /^[[:space:]]*$/) exit
                    for (i = start + 1; i <= end; i++) print lines[i]
                  }
                ')"
                commit_ok=0
                if [ -n "$trailers" ]; then
                  while IFS= read -r tline; do
                    [ -z "$tline" ] && continue
                    if [[ "$tline" =~ ^Signed-off-by:[[:space:]]+([^[:space:]<>][^<>]*)[[:space:]]+\<([^[:space:]<>@]+@[^[:space:]<>@.]+\.[^[:space:]<>@]+)\>[[:space:]]*$ ]]; then
                      sname="$(printf '%s' "${BASH_REMATCH[1]}" | sed 's/[[:space:]]*$//')"
                      semail="$(printf '%s' "${BASH_REMATCH[2]}" | tr '[:upper:]' '[:lower:]')"
                      if { [ "$sname" = "$author_name" ] && [ "$semail" = "$author_email" ]; } || \
                         { [ "$semail" != "noreply@github.com" ] && [ "$sname" = "$committer_name" ] && [ "$semail" = "$committer_email" ]; }; then
                        commit_ok=1
                        break
                      fi
                    fi
                  done <<< "$trailers"
                fi
                if [ "$commit_ok" -ne 1 ]; then
                  missing_dco="${missing_dco}${missing_dco:+ }${sha}"
                fi
              done <<< "$commits"
            fi
            if [ -n "$missing_dco" ]; then
              echo "::error::External contributor commits (including merges) must include a valid DCO sign-off ('git commit -s') matching the commit author/committer. Missing on: ${missing_dco}"
              exit 1
            fi
          fi
          echo "Contributor '${PR_AUTHOR}' verified."
