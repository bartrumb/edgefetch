name = "edgefetch-hub"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "AGENT_HUB"
class_name = "AgentHubDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentHubDO"]

[[rules]]
type = "Text"
globs = ["**/*.yaml", "**/*.yml"]
fallthrough = true

# Configure separate least-privilege secrets via Wrangler (never commit values):
#   npx wrangler secret put CALLER_TOKEN   # >= 24 random chars (optional owner/CI API token alongside GitHub OAuth)
#   npx wrangler secret put AGENT_TOKENS   # JSON map {"site-1":"<24+ random chars>","site-2":"..."} for outbound agents
#   npx wrangler secret put GITHUB_CLIENT_ID     # Optional GitHub OAuth App Client ID ("Sign in with GitHub")
#   npx wrangler secret put GITHUB_CLIENT_SECRET # Optional GitHub OAuth App Client Secret
#   npx wrangler secret put SESSION_SECRET       # Optional >= 24 char HS256 JWT signing secret (falls back to CALLER_TOKEN)
#   # Optional GitHub access control vars: GITHUB_ALLOWED_USERS="alice,@my-org", GITHUB_OWNER_LOGIN="alice", SIGNUP_MODE="invite_only"
#
# Optional v2 storage, tracking & FTS5 search bindings (keep commented until resources & migrations are approved):
# [[r2_buckets]]
# binding = "ARTIFACTS"
# bucket_name = "edgefetch-artifacts"
#
# [[d1_databases]]
# binding = "META"
# database_name = "edgefetch-meta"
# database_id = "<created-meta-d1-id>"
# migrations_dir = "migrations/meta"
#
# [[d1_databases]]
# binding = "SEARCH"
# database_name = "edgefetch-search"
# database_id = "<created-search-d1-id>"
# migrations_dir = "migrations/search"
#
# [[workflows]]
# name = "edgefetch-ingest"
# binding = "INGEST"
# class_name = "IngestWorkflow"
# [workflows.concurrency]
# limit = 10
#
# [[workflows]]
# name = "edgefetch-crawl"
# binding = "CRAWL"
# class_name = "CrawlWorkflow"
#
# # Optional 90-day fetch history retention cron (`scheduled()` in `src/index.ts`):
# # [triggers]
# # crons = ["0 4 * * *"]
#
# # Optional open-web search, ethical heavy-SPA fallback & signed webhook secrets (`npx wrangler secret put ...`):
# #   BRAVE_API_KEY       — Brave Search API subscription token for POST /v1/search
# #   SEARXNG_URL         — Optional self-hosted SearXNG JSON endpoint (e.g. https://searx.example.org)
# #   CRAWL4AI_API_URL    — Optional self-hosted/cloud Crawl4AI endpoint (e.g. https://crawl4ai.example.org) for heavy SPA fallback
# #   CRAWL4AI_API_TOKEN  — Optional Bearer token for authenticated Crawl4AI instances
# #   FIRECRAWL_API_URL   — Optional self-hosted Firecrawl URL (defaults to https://api.firecrawl.dev when FIRECRAWL_API_KEY is set)
# #   FIRECRAWL_API_KEY   — Optional Firecrawl API key for heavy SPA fallback (never used on robots.txt, 403/429, or challenges)
# #   SPA_FALLBACK_ORDER  — Optional provider priority (default: "crawl4ai,firecrawl")
# #   WEBHOOK_SECRET      — Default HMAC-SHA256 signing secret for async /v1/crawl webhooks

# Owner production environment with full three-layer storage (R2 + META D1 + SEARCH D1 FTS5 + IngestWorkflow).
# Top-level config remains storage-optional so public 1-Click Deploy users succeed without foreign D1 database IDs.
[env.production]
name = "edgefetch-hub"
workers_dev = true
preview_urls = false

[env.production.triggers]
crons = ["0 4 * * *"]

[[env.production.durable_objects.bindings]]
name = "AGENT_HUB"
class_name = "AgentHubDO"

[[env.production.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "edgefetch-artifacts"

[[env.production.d1_databases]]
binding = "META"
database_name = "edgefetch-meta"
database_id = "2e7a973c-2a1b-4164-a370-7bc0240266ff"
migrations_dir = "migrations/meta"

[[env.production.d1_databases]]
binding = "SEARCH"
database_name = "edgefetch-search"
database_id = "ea98eec0-9d67-41e9-b86b-d11b134f5728"
migrations_dir = "migrations/search"

[[env.production.workflows]]
name = "edgefetch-ingest"
binding = "INGEST"
class_name = "IngestWorkflow"

[[env.production.workflows]]
name = "edgefetch-crawl"
binding = "CRAWL"
class_name = "CrawlWorkflow"
