# Shared Go + TypeScript Declarative Site Adapter: Busch & Mueller (bumm.de) TYPO3 Product Pages
id: bumm-de
name: Busch & Mueller (bumm.de)
category: commerce-social
description: "Extracts TYPO3 JSON-LD Product metadata, table.attributes-table technical specs, and PDF mounting manual links from bumm.de product pages."
domains:
  - bumm.de
  - www.bumm.de
exampleUrls:
  - "https://bumm.de/en/product-detail/iq-x.html"
  - "https://bumm.de/de/product-detail/iq-x.html"

htmlRoutes:
  - id: bumm-de
    mode: dom
    match:
      optionalLeadingLocale: true
      exactSegments: false
      reservedFirstSegment:
        - typo3
      anyOf:
        - pathSegments:
            - product-detail
            - param: slug
              charset: url_seg
              minLen: 1
              maxLen: 160
        - pathSegments:
            - products
            - detail
            - param: slug
              charset: url_seg
              minLen: 1
              maxLen: 160
    jsonLdTypes:
      - Product
    vars:
      title:
        jsonLdPaths:
          - name
        cssText:
          - main h1
          - h1
          - title
        trim: true
      brand:
        jsonLdPaths:
          - brand.name
          - brand
        trim: true
      sku:
        jsonLdPaths:
          - sku
        trim: true
      price:
        jsonLdPaths:
          - offers.price
          - offers.0.price
        trim: true
      currency:
        jsonLdPaths:
          - offers.priceCurrency
          - offers.0.priceCurrency
        trim: true
      body:
        cssHtmlToMd:
          - main
          - .product-detail
          - body
        format: strip_leading_h1
        trim: true
    requireVars:
      - title
    titleTemplate: "{title}"
    bullets:
      - label: Brand
        template: "{brand}"
        whenVar: brand
      - label: SKU
        template: "`{sku}`"
        whenVar: sku
      - label: Price
        template: "{price} {currency}"
        whenVar: price
    bodyVar: body
    preserveBodyLinksFromVar: body
