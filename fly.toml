# Fly.io 1-Click Edge Container Blueprint (`fly launch --copy-config`)
# Runs the All-in-One EdgeFetch Hub + Go HTTP/2 + Headless Chromium + SQLite FTS5 on a persistent `/data` volume.
app = "edgefetch-hub"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.all-in-one"

[env]
  PORT = "8787"
  EDGEFETCH_DATA_DIR = "/data"
  EDGEFETCH_SITE_ID = "fly-edge-1"
  EDGEFETCH_TRUST_PROXY = "1"
  EDGEFETCH_TRUST_FLY_CLIENT_IP = "1"
  # Update EDGEFETCH_PUBLIC_ORIGIN if you change `app` or attach a custom domain (required for `/admin` CSRF origin checks behind Fly TLS).
  EDGEFETCH_PUBLIC_ORIGIN = "https://edgefetch-hub.fly.dev"

[[mounts]]
  source = "edgefetch_data"
  destination = "/data"
  initial_size = "3gb"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
