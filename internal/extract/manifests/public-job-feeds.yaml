  # 4. The Muse public jobs API (/api/public/jobs?...)
  - match:
      hosts:
        - www.themuse.com
        - themuse.com
      pathPrefix: /api/public/jobs
    twin:
      id: themuse-feed
      fetchUrl: "{requestUrl}"
      kind: json
      accept: application/json
    extract:
      vars:
        resCount:
          paths: [results]
          format: array_len
        totalFmt:
          paths: [total]
          format: int_comma
          fallbackTemplate: "{resCount}"
      requireVars:
        - resCount
      titleTemplate: "The Muse Public Jobs ({resCount} of {totalFmt})"
      sections:
        - heading: ""
          arrayPath: results
          limit: 50
          emptyText: "No open positions currently listed."
          itemVars:
            jTitle:
              paths: [name]
              trim: true
              default: Role
            co:
              paths: [company.name]
              trim: true
              default: "-"
            locs:
              paths: [locations]
              subField: name
              join: "; "
              default: "-"
            lUrl:
              paths: [refs.landing_page]
              requireHttps: true
            pub:
              paths: [publication_date]
              sliceMax: 10
              trim: true
              default: "-"
            roleCell:
              template: "[{jTitle}]({lUrl})"
              whenVars: [lUrl]
              fallbackVar: jTitle
          collectLinkVars:
            - lUrl
          columns:
            - header: Role
              template: "{roleCell}"
            - header: Company
              template: "{co}"
            - header: Locations
              template: "{locs}"
            - header: Published
              template: "{pub}"

  # 5a. Jobicy direct JSON API (/api/v2/remote-jobs?...)
  - match:
      hosts:
        - jobicy.com
      pathPrefix: /api/v2/remote-jobs
    twin:
      id: jobicy-feed
      fetchUrl: "{requestUrl}"
      kind: json
      accept: application/json
    extract:
      vars:
        jobCount:
          paths: [jobs]
          format: array_len
      requireVars:
        - jobCount
      titleTemplate: "Jobicy Remote Jobs ({jobCount})"
      sections:
        - heading: ""
          arrayPath: jobs
          limit: 50
          emptyText: "No open positions currently listed."
          itemVars:
            jTitle:
              paths: [jobTitle]
              format: strip_tags
              trim: true
              default: Role
            jUrl:
              paths: [url]
              requireHttps: true
            company:
              paths: [companyName]
              trim: true
              default: "-"
            geo:
              paths: [jobGeo]
              trim: true
              default: Remote
            cur:
              paths: [salaryCurrency]
              trim: true
              default: USD
            salMin:
              paths: [annualSalaryMin]
              excludeEquals: "0"
            salMax:
              paths: [annualSalaryMax]
              excludeEquals: "0"
            salRange:
              template: "{cur} {salMin}–{salMax}"
              whenVars: [salMin, salMax]
            salMinOnly:
              template: "{cur} {salMin}"
              whenVars: [salMin]
            sal:
              template: "{salRange}"
              whenVars: [salRange]
              fallbackVar: salMinOnly
              default: "-"
            roleCell:
