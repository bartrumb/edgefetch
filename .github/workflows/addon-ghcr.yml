name: Publish Multi-Arch Agent & Home Assistant Add-on Images (GHCR)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'edgefetch_fat/**'
      - 'Dockerfile'
      - 'Dockerfile.agent'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/addon-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-ha-addon:
    name: Build & Push ${{ matrix.image_prefix }}-${{ matrix.ha_arch }} (edge)
    runs-on: ${{ matrix.runner }}
    if: "!startsWith(github.ref, 'refs/tags/v')"
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon_dir: edgefetch_fat
            image_prefix: edgefetch-fat-addon
            platform: linux/amd64
            ha_arch: amd64
            runner: ubuntu-latest
          - addon_dir: edgefetch_fat
            image_prefix: edgefetch-fat-addon
            platform: linux/arm64
            ha_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract Add-on Version & Edge Tags
        id: meta
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          ADDON_DIR: ${{ matrix.addon_dir }}
          IMAGE_PREFIX: ${{ matrix.image_prefix }}
          HA_ARCH: ${{ matrix.ha_arch }}
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' "${ADDON_DIR}/config.yaml")
          if [ -z "$ver" ]; then
            echo "Failed to read version from ${ADDON_DIR}/config.yaml"
            exit 1
          fi
          owner=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/${IMAGE_PREFIX}-${HA_ARCH}"
          short_sha="${GITHUB_SHA::7}"
          echo "tags=${image}:edge,${image}:sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push add-on image (${{ matrix.addon_dir }})
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.addon_dir }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            io.hass.version=${{ steps.meta.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.ha_arch }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-ha-addon-release:
    name: Build & Push ${{ matrix.image_prefix }}-${{ matrix.ha_arch }} (release)
    runs-on: ${{ matrix.runner }}
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon_dir: edgefetch_fat
            image_prefix: edgefetch-fat-addon
            platform: linux/amd64
            ha_arch: amd64
            runner: ubuntu-latest
          - addon_dir: edgefetch_fat
            image_prefix: edgefetch-fat-addon
            platform: linux/arm64
            ha_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract Add-on Release Version & Tags
        id: meta
        env:
          REF: ${{ github.ref }}
          REPO_OWNER: ${{ github.repository_owner }}
          ADDON_DIR: ${{ matrix.addon_dir }}
          IMAGE_PREFIX: ${{ matrix.image_prefix }}
          HA_ARCH: ${{ matrix.ha_arch }}
        run: |
          set -euo pipefail
          ver="${REF#refs/tags/v}"
          cfg_ver=$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' "${ADDON_DIR}/config.yaml")
          if [ -z "$cfg_ver" ]; then
            echo "Failed to read version from ${ADDON_DIR}/config.yaml"
            exit 1
          fi
          owner=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/${IMAGE_PREFIX}-${HA_ARCH}"
          echo "tags=${image}:${ver},${image}:latest" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release add-on image (${{ matrix.addon_dir }})
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.addon_dir }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            io.hass.version=${{ steps.meta.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.ha_arch }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-standalone-multiarch:
    name: Publish Multi-Arch OCI Agent Images (edge)
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/v')"
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Version, Owner & Tags
        id: meta
        env:
          REF: ${{ github.ref }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' edgefetch_fat/config.yaml)
          owner=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/edgefetch-agent"
          short_sha="${GITHUB_SHA::7}"
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "fat_tags=${image}:latest,${image}:${ver}" >> "$GITHUB_OUTPUT"
            echo "lite_tags=${image}:lite,${image}:${ver}-lite" >> "$GITHUB_OUTPUT"
            echo "aio_tags=ghcr.io/${owner}/edgefetch:latest,ghcr.io/${owner}/edgefetch:${ver}" >> "$GITHUB_OUTPUT"
          else
            echo "fat_tags=${image}:edge,${image}:sha-${short_sha}" >> "$GITHUB_OUTPUT"
            echo "lite_tags=${image}:edge-lite,${image}:sha-${short_sha}-lite" >> "$GITHUB_OUTPUT"
            echo "aio_tags=ghcr.io/${owner}/edgefetch:edge,ghcr.io/${owner}/edgefetch:sha-${short_sha}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Multi-Arch Fat Agent (amd64 + arm64)
        id: push-fat
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.fat_tags }}

      - name: Attest Multi-Arch Fat Agent
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push-fat.outputs.digest }}
          push-to-registry: true

      - name: Build & Push Multi-Arch Distroless Lite Agent (amd64 + arm64)
        id: push-lite
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.lite_tags }}

      - name: Attest Multi-Arch Distroless Lite Agent
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push-lite.outputs.digest }}
          push-to-registry: true

      - name: Build & Push Multi-Arch All-in-One Hub + Agent Container (amd64 + arm64)
        id: push-aio
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.all-in-one
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.aio_tags }}

      - name: Attest Multi-Arch All-in-One Container
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.owner }}/edgefetch
          subject-digest: ${{ steps.push-aio.outputs.digest }}
          push-to-registry: true
