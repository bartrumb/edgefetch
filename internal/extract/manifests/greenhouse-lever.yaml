  # 3. Lever US whole-board API
  - match:
      hosts:
        - jobs.lever.co
      pathSegments:
        - param: org
          charset: pkg
          maxLen: 80
          reserved:
            - embed
            - v1
            - api
            - static
            - assets
            - favicon.ico
    twin:
      id: lever-board
      fetchUrl: "https://api.lever.co/v0/postings/{org}?mode=json&limit=100"
      kind: json
      accept: application/json
    extract:
      wrapRootArrayAs: jobs
      vars:
        total:
          paths: [jobs]
          format: array_len
      requireVars:
        - total
      titleTemplate: "{org} — Lever Job Board ({total} open roles)"
      sections:
        - heading: ""
          arrayPath: jobs
          limit: 120
          linkScanLimit: 2000
          emptyText: "No open positions currently listed."
          paginationMeta:
            cursorMode: last_id
            idField: id
          itemVars:
            jTitle:
              paths: [text]
              trim: true
              default: Role
            id:
              paths: [id]
            rawUrl:
              paths: [hostedUrl]
              requireHttps: true
            jUrl:
              template: "{rawUrl}"
              whenVars: [rawUrl]
              fallbackTemplate: "https://{host}/{org}/{id}"
            team:
              paths: [categories.team, categories.department]
              trim: true
              default: "-"
            loc:
              paths: [categories.location]
              trim: true
              default: "-"
            wp:
              paths: [workplaceType]
              trim: true
              default: "-"
          collectLinkVars:
            - jUrl
          columns:
            - header: Role
              template: "[{jTitle}]({jUrl})"
            - header: Team
              template: "{team}"
            - header: Location
              template: "{loc}"
            - header: Workplace
              template: "{wp}"

